<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 440px;
    height: 280px;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "PingFang SC", sans-serif;
    background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 50%, #fed7aa 100%);
    color: #43251c;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 24px;
    border: 3px solid #43251c;
  }
  .bg-circle {
    position: absolute;
    width: 280px;
    height: 280px;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.8) 0%, rgba(255, 255, 255, 0) 70%);
    border-radius: 50%;
    z-index: 1;
  }
  .content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .icon-img {
    width: 72px;
    height: 72px;
    border-radius: 18px;
    border: 2px solid #43251c;
    box-shadow: 0 4px 12px rgba(67, 37, 28, 0.18);
    margin-bottom: 12px;
  }
  .title {
    font-size: 26px;
    font-weight: 900;
    color: #43251c;
    letter-spacing: -0.5px;
    margin-bottom: 4px;
  }
  .sub {
    font-size: 14px;
    font-weight: 700;
    color: #b45309;
    margin-bottom: 12px;
  }
  .pill-row {
    display: flex;
    gap: 8px;
  }
  .pill {
    background: #43251c;
    color: #fff;
    font-size: 11px;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 20px;
    box-shadow: 0 2px 4px rgba(67, 37, 28, 0.15);
  }
</style>
</head>
