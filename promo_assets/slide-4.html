<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  body {
    width: 1280px;
    height: 800px;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #fdfaf5;
    color: #3e2723;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .bg-decor {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: 
      radial-gradient(#ebd9c5 1.2px, transparent 1.2px),
      radial-gradient(#ebd9c5 1.2px, #fdfaf5 1.2px);
    background-size: 28px 28px;
    background-position: 0 0, 14px 14px;
    opacity: 0.45;
    z-index: 0;
  }
  .bg-glow-1 {
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 214, 153, 0.45) 0%, rgba(255, 245, 230, 0) 70%);
    top: -100px;
    right: -100px;
    z-index: 1;
  }
  .bg-glow-2 {
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 183, 133, 0.35) 0%, rgba(255, 245, 230, 0) 70%);
    bottom: -150px;
    left: 200px;
    z-index: 1;
  }
  .navbar {
    position: relative;
    z-index: 10;
    height: 84px;
    padding: 0 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1.5px solid rgba(67, 37, 28, 0.08);
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(12px);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .brand img {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(67, 37, 28, 0.15);
  }
  .brand-title {
    font-size: 26px;
    font-weight: 800;
    color: #43251c;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-badge {
    background: #ffecd2;
    color: #b24d00;
    font-size: 13px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 20px;
    border: 1px solid #ffd099;
  }
  .brand-subtitle {
    font-size: 14px;
    color: #795548;
    font-weight: 500;
  }
  .nav-platforms {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .plat-pill {
    background: #fff;
    border: 1.5px solid #ebd0bc;
    color: #5d4037;
    font-size: 13px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 20px;
    box-shadow: 0 2px 4px rgba(67, 37, 28, 0.04);
  }
  .plat-pill.active {
    background: #43251c;
    color: #fff;
    border-color: #43251c;
  }
  .content {
    position: relative;
    z-index: 10;
    flex: 1;
    display: grid;
    grid-template-columns: 460px 1fr;
    padding: 44px 56px;
    gap: 48px;
    align-items: center;
  }
  .hero-text {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .hero-tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, #ff7e5f, #feb47b);
    color: #fff;
    font-size: 13px;
    font-weight: 800;
    padding: 5px 14px;
    border-radius: 20px;
    width: fit-content;
    box-shadow: 0 4px 10px rgba(255, 126, 95, 0.3);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .hero-title {
    font-size: 38px;
    line-height: 1.25;
    font-weight: 900;
    color: #43251c;
    letter-spacing: -0.8px;
  }
  .hero-title span {
    background: linear-gradient(135deg, #d32f2f, #f57c00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .hero-desc {
    font-size: 17px;
    line-height: 1.6;
    color: #6d4c41;
    font-weight: 500;
  }
  .feature-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 6px;
  }
  .feat-item {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 15px;
    font-weight: 700;
    color: #43251c;
    background: rgba(255, 255, 255, 0.85);
    padding: 10px 16px;
    border-radius: 12px;
    border: 1px solid rgba(220, 190, 170, 0.6);
    box-shadow: 0 2px 6px rgba(67, 37, 28, 0.04);
  }
  .feat-item .icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    background: #e8f5e9;
    color: #2e7d32;
    border-radius: 50%;
    font-size: 14px;
    font-weight: 900;
  }
  .mockup-container {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .mac-window {
    background: #fff;
    border-radius: 18px;
    border: 2px solid #43251c;
    box-shadow: 
      0 18px 40px -8px rgba(67, 37, 28, 0.28),
      0 6px 16px rgba(0,0,0,0.06);
    overflow: hidden;
    position: relative;
    max-height: 590px;
    width: 100%;
    display: flex;
    flex-direction: column;
  }
  .mac-header {
    height: 38px;
    background: #fbf7f2;
    border-bottom: 1.5px solid #ebd0bc;
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 8px;
  }
  .mac-dots {
    display: flex;
    gap: 6px;
  }
  .mac-dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
  }
  .dot-red { background: #ff5f56; border: 1px solid #e0443e; }
  .dot-yellow { background: #ffbd2e; border: 1px solid #dea123; }
  .dot-green { background: #27c93f; border: 1px solid #1aab29; }
  .mac-address-bar {
    flex: 1;
    margin: 0 30px;
    background: #fff;
    border: 1px solid #e2cfc2;
    height: 24px;
    border-radius: 6px;
    font-size: 11px;
    color: #8d6e63;
    display: flex;
    align-items: center;
    padding: 0 10px;
    gap: 6px;
    font-family: monospace;
  }
  .mac-body {
    flex: 1;
    overflow: hidden;
    background: #fdfdfd;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .callout-badge {
    position: absolute;
    background: #ff4757;
    color: #fff;
    padding: 8px 16px;
    border-radius: 30px;
    font-weight: 800;
    font-size: 14px;
    box-shadow: 0 8px 20px rgba(255, 71, 87, 0.4);
    border: 2px solid #fff;
    display: flex;
    align-items: center;
    gap: 6px;
    z-index: 20;
    animation: float 3s ease-in-out infinite;
  }

</style>
</head>
