<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  body {
    width: 1080px;
    height: 1440px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans", "Microsoft YaHei", sans-serif;
    background: #fdf8f2;
    color: #3e2723;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 60px 54px;
    justify-content: space-between;
  }
  .bg-decor {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: 
      radial-gradient(#ebd9c5 1.5px, transparent 1.5px),
      radial-gradient(#ebd9c5 1.5px, #fdf8f2 1.5px);
    background-size: 32px 32px;
    background-position: 0 0, 16px 16px;
    opacity: 0.5;
    z-index: 0;
  }
  .bg-glow {
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 214, 153, 0.5) 0%, rgba(255, 245, 230, 0) 70%);
    top: -100px;
    right: -100px;
    z-index: 1;
  }
  .top-header {
    position: relative;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px dashed #ebd0bc;
    padding-bottom: 24px;
  }
  .brand-pill {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #fff;
    padding: 8px 18px;
    border-radius: 30px;
    border: 2px solid #43251c;
    box-shadow: 0 4px 0 #43251c;
  }
  .brand-pill img {
    width: 38px;
    height: 38px;
    border-radius: 8px;
  }
  .brand-pill span {
    font-size: 20px;
    font-weight: 900;
    color: #43251c;
    letter-spacing: -0.5px;
  }
  .page-num {
    font-size: 18px;
    font-weight: 800;
    color: #8d6e63;
    background: #faeedd;
    padding: 6px 16px;
    border-radius: 20px;
    border: 1.5px solid #ebd0bc;
  }
  .content-main {
    position: relative;
    z-index: 10;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 32px;
    margin: 20px 0;
  }
  .bottom-footer {
    position: relative;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 2px dashed #ebd0bc;
    padding-top: 24px;
    font-size: 16px;
    font-weight: 700;
    color: #8d6e63;
  }
  .footer-tags {
    display: flex;
    gap: 10px;
  }
  .f-tag {
    background: #ebd8c8;
    color: #43251c;
    padding: 4px 12px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
  }
  .card-box {
    background: #fff;
    border: 3px solid #43251c;
    border-radius: 24px;
    box-shadow: 0 8px 0 #43251c;
    overflow: hidden;
  }

.cover-tag-row {
  display: flex;
  gap: 12px;
}
.cover-tag {
  background: #ff5722;
  color: #fff;
  font-size: 22px;
  font-weight: 900;
  padding: 8px 22px;
  border-radius: 30px;
  border: 2.5px solid #43251c;
  box-shadow: 0 4px 0 #43251c;
}
.cover-tag.secondary {
  background: #ffc107;
  color: #43251c;
}
.cover-hero-title {
  font-size: 64px;
  line-height: 1.22;
  font-weight: 900;
  color: #43251c;
  letter-spacing: -1.5px;
}
.cover-hero-title mark {
  background: #ff5722;
  color: #fff;
  padding: 0 8px;
  border-radius: 8px;
}
.vs-container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #fff;
  border: 3px solid #43251c;
  border-radius: 20px;
  box-shadow: 0 8px 0 #43251c;
  padding: 24px 32px;
  gap: 20px;
}
.vs-item {
  flex: 1;
  text-align: center;
}
.vs-item.fake {
  opacity: 0.7;
}
.vs-item.real {
  background: #fff8e1;
  border: 2px solid #ff9800;
  border-radius: 16px;
  padding: 16px;
}
.vs-label {
  font-size: 18px;
  font-weight: 800;
  margin-bottom: 6px;
}
.vs-price {
  font-size: 38px;
  font-weight: 900;
}
.cover-badge-banner {
  background: #43251c;
  color: #fff;
  padding: 18px 24px;
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.c-pill-wrap {
  display: flex;
  gap: 8px;
}
.c-pill {
  background: #ffecd2;
  color: #b24d00;
  font-size: 15px;
  font-weight: 800;
  padding: 6px 14px;
  border-radius: 20px;
}
</style>
</head>
